name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "${{ github.run_number }}"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/trooptrak-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/trooptrak-${{ github.ref_name }}.apk
          generate_release_notes: true
