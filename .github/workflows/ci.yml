name: CI

on:
  push:
    branches: [main, App_Overhaul]
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --prefix firestore_rules_test
      - run: npx --yes firebase-tools@13.15.1 emulators:exec --only firestore "npm --prefix firestore_rules_test test"
