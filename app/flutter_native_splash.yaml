  android: true
  ios: false
  web: false
  color: "#f7f6f1"
  color_dark: "#272727"
  background_image: lib/assets/TroopTrakSplashscreen.png
  android_12:
    image: lib/assets/phone_auth/troopTrak_logo.png
    color: "#f7f6f1"
    color_dark: "#272727"
