# Carried over from firebase_project_2/flutter_native_splash-production.yaml.
# Regenerate with: dart run flutter_native_splash:create
# iOS is off until it can be generated on a machine that may overwrite
# ios/Runner/Assets.xcassets (blocked here by antivirus file protection).
